<div class="relative inline-block">

  <!-- Botão que abre o perfil -->
  <button
    (click)="onAlternarPerfil()"
    type="button"
    aria-label="Abrir perfil do usuário"
    class="flex size-9 items-center justify-center overflow-hidden rounded-full border-2 border-purple-400
           bg-gray-200 transition hover:brightness-95"
  >
    <img class="size-full object-cover" src="assets/images/empty-avatar.png" alt="" />
  </button>

  <!-- Caixa do perfil -->
  <div
    [class.hidden]="!perfilAberto"
    class="absolute right-0 top-full z-50 mt-3
           flex w-[320px] max-w-[calc(100vw-2rem)]
           max-h-[calc(100vh-5rem)] flex-col
           overflow-hidden rounded-xl bg-white
           shadow-2xl"
  >

    <!-- Cabeçalho -->
    <div class="shrink-0 p-4">

      <div class="flex items-center gap-3">

        <div class="size-14 shrink-0 overflow-hidden rounded-full border-4 border-purple-300 bg-gray-200">
          <img class="size-full object-cover" src="assets/images/empty-avatar.png" alt="" />
        </div>

        <div class="min-w-0">
          <p class="truncate text-sm font-medium text-gray-900">
            Juan Pablo do Carmo
          </p>

          <p class="truncate text-xs text-gray-500">
            juan.pablo@eaportal.org
          </p>
        </div>

      </div>

      <!-- Ações -->
      <div class="mt-3 flex flex-col gap-2 pl-[68px]">

        <button class="rounded-full bg-gray-100 px-4 py-2
                       text-xs transition hover:bg-gray-200">
          Mudar de conta
        </button>

        <button class="rounded-full bg-blue-500 px-4 py-2
                       text-xs text-white transition hover:bg-blue-600">
          Enviar feedback
        </button>

      </div>
    </div>

    <!-- Abas -->
    <div class="flex shrink-0 border-b border-gray-200">

      <button
        *ngFor="let aba of ['perfil', 'unidade', 'aluno']"
        (click)="onSelecionarAba(aba)"
        class="flex-1 border-b-2 px-3 py-3 text-xs capitalize
               transition"
        [ngClass]="abaAtiva === aba
          ? 'border-purple-600 text-purple-700'
          : 'border-transparent text-gray-600 hover:bg-gray-50'"
      >
        {{ aba }}
      </button>

    </div>

    <!-- Conteúdo -->
    <div class="min-h-0 flex-1 overflow-y-auto bg-purple-50/70 p-4">

      <div
        *ngIf="abaAtiva === 'perfil'"
        class="rounded-xl border border-gray-100 border-l-4
               border-l-purple-600 bg-white p-3 shadow-sm"
      >
        <p class="text-xs font-semibold text-gray-900">
          Desenvolvedor Portal
        </p>

        <p class="mt-1 text-xs text-gray-500">
          Casa Publicadora Brasileira - Editora
        </p>
      </div>

      <div *ngIf="abaAtiva === 'unidade'">
        Conteúdo da unidade.
      </div>

      <div *ngIf="abaAtiva === 'aluno'">
        Conteúdo do aluno.
      </div>

    </div>

    <!-- Rodapé -->
    <div class="shrink-0 border-t border-gray-200 bg-white p-4">

      <button
        (click)="onFecharPerfil()"
        class="mb-3 flex w-full items-center gap-3 rounded-full
               bg-purple-200 px-4 py-3 text-sm font-semibold
               text-purple-900 transition hover:bg-purple-300"
      >
        <span>⇥</span>
        Sair
      </button>

      <button
        (click)="onFecharPerfil()"
        class="flex w-full items-center gap-3 rounded-full
               bg-purple-700 px-4 py-3 text-sm font-semibold
               text-white transition hover:bg-purple-800"
      >
        <span>⏻</span>
        Sair Seguro
      </button>

      <div class="mt-3 flex justify-between px-2 text-[10px] text-gray-400">
        <span>© Portal Educacional</span>
        <span>Versão 4.41.18</span>
      </div>

    </div>

  </div>
</div>
