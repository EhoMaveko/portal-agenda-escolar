
<section class="min-w-0 rounded-xl border border-green-200 bg-green-50 p-4 shadow-sm sm:p-6">
  <div class="mb-5">
    <h2 class="text-xl font-bold text-green-900">
      Nova agenda
    </h2>

    <p class="mt-1 text-sm text-gray-600">
      Preencha os dados para cadastrar um evento escolar.
    </p>
  </div>

  <form
    class="grid min-w-0 grid-cols-1 gap-4 md:grid-cols-2"
    (ngSubmit)="enviarFormulario()"
  >
    <div class="grid min-w-0 gap-2">
      <label for="titulo" class="font-medium text-gray-700">
        Título *
      </label>

      <input
        id="titulo"
        type="text"
        name="titulo"
        [(ngModel)]="titulo"
        required
        maxlength="255"
        placeholder="Ex.: Reunião de pais"
        class="min-h-11 w-full min-w-0 rounded-lg border border-gray-300 bg-white p-3 focus:outline-none focus:ring-2 focus:ring-green-600"
      />
    </div>

    <div class="grid min-w-0 gap-2">
      <label for="dataEvento" class="font-medium text-gray-700">
        Data e hora *
      </label>

      <input
        id="dataEvento"
        type="datetime-local"
        name="dataEvento"
        [(ngModel)]="dataEvento"
        required
        class="min-h-11 w-full min-w-0 max-w-full rounded-lg border border-gray-300 bg-white p-3 focus:outline-none focus:ring-2 focus:ring-green-600"
      />
    </div>

    <div class="grid min-w-0 gap-2 md:col-span-2">
      <label for="descricao" class="font-medium text-gray-700">
        Descrição
      </label>

      <textarea
        id="descricao"
        name="descricao"
        [(ngModel)]="descricao"
        rows="3"
        placeholder="Detalhes do evento..."
        class="w-full min-w-0 rounded-lg border border-gray-300 bg-white p-3 focus:outline-none focus:ring-2 focus:ring-green-600"
      ></textarea>
    </div>

    <div class="grid min-w-0 gap-2 md:col-span-2">
      <label for="perfil" class="font-medium text-gray-700">
        Perfil *
      </label>

      <select
        id="perfil"
        name="perfil"
        [(ngModel)]="perfilId"
        required
        class="min-h-11 w-full min-w-0 rounded-lg border border-gray-300 bg-white p-3 focus:outline-none focus:ring-2 focus:ring-green-600"
      >
        <option
          *ngFor="let perfil of perfis"
          [ngValue]="perfil.id"
        >
          {{ perfil.nome }} ({{ perfil.tipo }})
        </option>
      </select>
    </div>

    <div class="grid min-w-0 gap-3 md:col-span-2 sm:flex sm:items-center sm:justify-between">
      <p
        *ngIf="mensagem"
        role="status"
        aria-live="polite"
        class="min-w-0 break-words text-sm font-medium text-gray-700"
      >
        {{ mensagem }}
      </p>

      <button
        type="submit"
        [disabled]="salvando || !titulo.trim() || !dataEvento || !perfilId"
        class="min-h-11 w-full shrink-0 rounded-lg bg-green-800 px-5 py-3 font-semibold text-white transition-colors hover:bg-green-900 focus:outline-none focus:ring-2 focus:ring-green-600 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto"
      >
        {{ salvando ? 'Processando...' : 'Cadastrar agenda' }}
      </button>
    </div>
  </form>
</section>
