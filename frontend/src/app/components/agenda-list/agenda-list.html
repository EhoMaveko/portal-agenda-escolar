
<section class="grid gap-4">
  <h2 class="text-xl font-bold text-gray-800">
    Agendas cadastradas
  </h2>

  <p
    *ngIf="carregando"
    class="text-gray-600 p-4 text-center"
    role="status"
  >
    Carregando agendas...
  </p>

  <p
    *ngIf="erro"
    class="p-4 rounded-lg border border-red-200 bg-red-50 text-red-700"
    role="alert"
  >
    {{ erro }}
  </p>

  <p
    *ngIf="!carregando && !erro && agendas.length === 0"
    class="p-6 rounded-xl border border-dashed border-gray-300 text-center text-gray-500"
  >
    Nenhuma agenda cadastrada.
  </p>

  <article
    *ngFor="let agenda of agendas"
    class="grid gap-3 p-5 rounded-xl border border-gray-200 bg-white shadow-sm"
  >
    <h3 class="text-lg font-semibold text-gray-900">
      {{ agenda.titulo }}
    </h3>

    <p *ngIf="agenda.descricao" class="text-gray-600 leading-relaxed">
      {{ agenda.descricao }}
    </p>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">
      <p class="text-gray-700">
        <strong>Data:</strong>
        {{ agenda.data_evento | date:'dd/MM/yyyy' }}
      </p>

      <p class="text-gray-700">
        <strong>Status:</strong>
        <span class="inline-block px-2 py-1 rounded-full text-green-800 font-medium">
          {{ agenda.status }}
        </span>
      </p>
    </div>

    <button
      type="button"
      (click)="selecionar.emit(agenda.id)"
      class="w-full sm:w-fit min-h-11 px-4 py-3 rounded-lg bg-green-800 text-white font-semibold hover:bg-green-900 focus:outline-none focus:ring-2 focus:ring-green-600 focus:ring-offset-2 transition-colors"
    >
      Ver respostas e responder
    </button>
  </article>
</section>
