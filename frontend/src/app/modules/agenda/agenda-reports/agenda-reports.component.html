
<div class="px-2 py-2 sm:px-3 lg:px-3">
    <section class="min-w-0 rounded-lg inset-shadow-sm inset-shadow-black/20 border border-gray-200 bg-gray-100 p-4 sm:p-6">

      <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="min-w-0">
          <h2 class="text-xl font-bold text-gray-900">
            {{ 'agendaReports.titulo' | translate }}
          </h2>

          <p class="mt-2 text-sm text-gray-600 sm:text-base">
            {{ 'agendaReports.descricao' | translate }}
          </p>
        </div>

        <button
          type="button"
          (click)="onSolicitarResumoDsa()"
          [disabled]="solicitandoRelatorio"
          class="w-full shrink-0 rounded-lg bg-gray-600 px-4 py-3 text-white transition hover:bg-gray-900 disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto"
        >
          {{ (solicitandoRelatorio ? 'agendaReports.processando' : 'agendaReports.solicitar') | translate }}
        </button>
      </div>

      <p
        *ngIf="mensagemRelatorio"
        role="status"
        aria-live="polite"
        class="mt-3 wrap-break-word text-sm text-gray-700"
      >
        {{ mensagemRelatorio }}
      </p>
    </section>
</div>
