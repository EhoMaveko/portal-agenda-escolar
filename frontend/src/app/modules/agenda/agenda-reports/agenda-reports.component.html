
    <section class="min-w-0 rounded-lg border border-green-200 bg-green-50 p-4 sm:p-6">

      <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="min-w-0">
          <h2 class="text-xl font-bold text-green-900">
            Relatório DSA
          </h2>

          <p class="mt-2 text-sm text-gray-600 sm:text-base">
            Gere um resumo das agendas e de suas respostas.
          </p>
        </div>

        <button
          type="button"
          (click)="onSolicitarResumoDsa()"
          [disabled]="solicitandoRelatorio"
          class="w-full shrink-0 rounded-lg bg-green-800 px-4 py-3 text-white transition hover:bg-green-900 disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto"
        >
          {{ solicitandoRelatorio ? 'Processando...' : 'Solicitar relatório DSA' }}
        </button>
      </div>

      <p
        *ngIf="mensagemRelatorio"
        role="status"
        aria-live="polite"
        class="mt-3 wrap-break-word text-sm text-gray-700"
      >
        {{ mensagemRelatorio }}
      </p>
    </section>
