
<div class="px-4 py-4 sm:px-3 lg:px-3">
<section (animate.enter)="animateForm($event)" class="min-w-0 rounded-xl inset-shadow-sm inset-shadow-black/20 --color-base-service-chave3-50 p-4 shadow-sm sm:p-6">

  <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-xl font-bold --color-title">
        {{ 'criarAgenda.titulo-pagina' | translate }}
      </h2>

      <p class="mt-1 text-sm --color-subtitile">
        {{ 'criarAgenda.subtitulo' | translate }}
      </p>
    </div>
  </div>

  <form
    class="grid min-w-0 grid-cols-1 gap-4 md:grid-cols-2"
    (ngSubmit)="onEnviarFormulario()"
  >
    <div class="grid min-w-0 gap-2">
      <label for="titulo" class="font-medium text-gray-700">
        {{ 'criarAgenda.titulo-formulario' | translate }} *
      </label>

      <input
        id="titulo"
        type="text"
        name="titulo"
        [(ngModel)]="titulo"
        required
        maxlength="255"
        [placeholder]="'criarAgenda.placeholder-titulo' | translate"
        class="min-h-11 w-full min-w-0 rounded-lg border border-gray-300 bg-white p-3 focus:outline-none focus:ring-2 focus:ring-green-600"
      />
    </div>

    <div class="grid min-w-0 gap-2">
      <label for="dataEvento" class="font-medium text-gray-700">
        {{ 'criarAgenda.data-hora' | translate }} *
      </label>

      <input
        id="dataEvento"
        type="datetime-local"
        name="dataEvento"
        [(ngModel)]="dataEvento"
        required
        class="min-h-11 w-full min-w-0 max-w-full rounded-lg border border-gray-300 bg-white p-3 focus:outline-none focus:ring-2 focus:ring-green-600"
      />
    </div>

    <div class="grid min-w-0 gap-2 md:col-span-2">
      <label for="descricao" class="font-medium text-gray-700">
        {{ 'criarAgenda.descricao' | translate }}
      </label>

      <textarea
        id="descricao"
        name="descricao"
        [(ngModel)]="descricao"
        rows="3"
        [placeholder]="'criarAgenda.placeholder-descricao' | translate"
        class="w-full min-w-0 rounded-lg border border-gray-300 bg-white p-3 focus:outline-none focus:ring-2 focus:ring-green-600"
      ></textarea>
    </div>

    <div class="grid min-w-0 gap-2 md:col-span-2">
      <label for="perfil" class="font-medium text-gray-700">
        {{ 'criarAgenda.perfil' | translate }} *
      </label>

      <select
        id="perfil"
        name="perfil"
        [(ngModel)]="perfilId"
        required
        class="min-h-11 w-full min-w-0 rounded-lg border border-gray-300 bg-white p-3 focus:outline-none focus:ring-2 focus:ring-green-600"
      >
        <option
          *ngFor="let perfil of perfis"
          [ngValue]="perfil.id"
        >
          {{ perfil.nome }} ({{ perfil.tipo }})
        </option>
      </select>
    </div>

    <div class="flex min-w-0 flex-col-reverse gap-3 md:col-span-2 sm:flex-row sm:items-center sm:justify-between">
      <p
        *ngIf="mensagem"
        role="status"
        aria-live="polite"
        class="min-w-0 wrap-break-word text-sm font-medium text-gray-700"
      >
        {{ mensagem }}
      </p>

      <button
        type="submit"
        [disabled]="salvando || !titulo.trim() || !dataEvento || !perfilId"
        class="min-h-11 w-full shrink-0 rounded-lg bg-green-800 px-5 py-3 font-semibold text-white transition-colors hover:bg-green-900 focus:outline-none focus:ring-2 focus:ring-green-600 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60 sm:ml-auto sm:w-auto"
      >
        {{ (salvando ? 'criarAgenda.processando' : 'criarAgenda.cadastrar-agenda') | translate }}
      </button>
    </div>
  </form>
</section>
</div>
