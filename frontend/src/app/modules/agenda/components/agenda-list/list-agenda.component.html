<div *ngIf="!carregando && !erro && agendas.length > 0" class="flex min-w-0 flex-col gap-2">
  <article *ngFor="let agenda of agendas" (click)="selecionar.emit(agenda.id)" class="group relative flex min-w-0 items-center justify-between gap-3
           overflow-hidden rounded-xl border border-gray-200 bg-white
           px-4 py-3 shadow-sm cursor-pointer
           transition-all duration-200 ease-in-out
           hover:border-violet-200 hover:bg-violet-50/30 hover:shadow-md
           before:absolute before:inset-y-0 before:left-0
           before:w-1 before:bg-violet-600">
    <div class="flex min-w-0 flex-1 items-center gap-3 pl-1">
      <div class="flex size-8 shrink-0 items-center justify-center rounded-xl bg-purple-100">
        <svg-icon class="flex items-center justify-center w-8 h-8 rounded-xl p-1.5 text-modules-eclass-700 bg-modules-eclass-500/10 ng-star-inserted"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20"><path fill="currentColor" d="M18.749 3.944c0-1.512-1.108-2.61-2.63-2.61H15.4c0-.227.002-.427 0-.627-.005-.408-.287-.705-.666-.706-.383-.002-.667.293-.672.7-.003.205 0 .411 0 .618h-4.018V.723C10.04.299 9.76-.002 9.372 0c-.39.002-.664.3-.667.726v.59H4.687c0-.218.003-.42 0-.62C4.68.292 4.39-.004 4.01 0c-.373.005-.654.296-.66.69-.004.207 0 .413 0 .643h-.723C1.106 1.335.001 2.435 0 3.949v13.437c0 1.51 1.108 2.613 2.629 2.613h13.496c1.519 0 2.624-1.103 2.624-2.618V3.944Zm-1.34.065v13.31c0 .87-.48 1.347-1.36 1.347H2.702c-.889 0-1.363-.475-1.363-1.365V4.012c0-.871.48-1.346 1.36-1.346h.649c0 .238-.004.445 0 .654.008.387.3.68.672.678.372-.001.658-.294.665-.686.004-.207 0-.414 0-.633h4.019c0 .212-.003.419 0 .624.005.403.297.7.677.695.372-.004.654-.297.66-.69.004-.207 0-.414 0-.631h4.019v.59c.003.426.275.727.662.731.396.004.674-.299.677-.737v-.592c.413.017.822-.068 1.22.075.46.165.768.591.787 1.078.002.062.002.125.002.187h.002Z"></path><path fill="currentColor" d="M14.636 8H10.14c-.461 0-.766.269-.763.67.003.392.307.662.754.662h4.518c.446 0 .75-.269.753-.661.003-.4-.304-.671-.764-.671ZM14.648 14c-.753-.002-1.507 0-2.26 0-.753 0-1.506-.001-2.259 0-.448 0-.75.266-.753.66-.003.393.302.672.742.672h4.54c.44 0 .745-.277.743-.671-.003-.392-.308-.66-.753-.661ZM7.449 6.683c-.238-.036-.434.055-.601.223-.49.492-.983.98-1.496 1.492-.3-.303-.576-.589-.859-.865-.282-.274-.69-.275-.955-.012s-.265.671.01.95c.44.446.884.888 1.331 1.325.284.276.665.274.954.002.188-.176.367-.361.549-.543.478-.476.956-.95 1.433-1.428.2-.2.264-.44.171-.707a.634.634 0 0 0-.537-.437ZM7.451 12.684c-.238-.037-.434.052-.602.22-.49.492-.983.98-1.499 1.494-.303-.306-.581-.598-.87-.878a.663.663 0 0 0-.94-.002.654.654 0 0 0-.008.935c.448.457.9.909 1.36 1.354.269.26.647.257.924.006.134-.121.259-.253.387-.38l1.61-1.605c.2-.2.266-.438.174-.706a.633.633 0 0 0-.536-.438Z">
        </path>
        </svg>
        </svg-icon>
      </div>

      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-medium text-gray-900">
          {{ agenda.titulo }}
        </p>

        <p class="mt-1 truncate text-xs text-gray-500">
          <ng-container *ngIf="agenda.descricao">
            {{ agenda.descricao }}
          </ng-container>
        </p>
      </div>
    </div>

    <div class="flex shrink-0 items-center gap-3">
      <span class="rounded-full bg-green-100 px-2.5 py-1 text-xs font-medium text-green-700">
        {{ agenda.status }}
      </span>
        <p  class="mt-1 truncate text-xs text-gray-500">
          {{ agenda.data_evento | date:'dd/MM' }}
        </p>

      <i class="pi pi-chevron-right text-sm text-gray-400 transition-all duration-200 group-hover:translate-x-1 group-hover:text-violet-600"></i>
      <button
        type="button"
        (click)="$event.stopPropagation(); excluir.emit(agenda)"
        [attr.aria-label]="'listaDeAgendas.excluir' | translate"
        class="rounded-md px-2 py-1 text-xs font-medium text-red-700 hover:bg-red-50"
      >
        {{ 'listaDeAgendas.excluir' | translate }}
      </button>
    </div>
  </article>
</div>
